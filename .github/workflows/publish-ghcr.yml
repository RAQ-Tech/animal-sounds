name: Publish container image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so the image can be tested before it
      # is ever pushed. The push step below reuses this layer cache.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: animal-sounds:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The repo has no test suite, so this is the gate that stops a broken
      # image reaching GHCR. It starts the container and exercises the same
      # endpoints the Docker and Unraid healthchecks rely on.
      - name: Smoke test image
        run: |
          docker run -d --name animal-sounds-ci -p 3000:3000 animal-sounds:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          python - <<'PY'
          import json, urllib.request

          # Read the body inside the context manager: returning the response
          # itself hands back a closed connection that reads as empty.
          def get(path):
              with urllib.request.urlopen(f"http://127.0.0.1:3000{path}", timeout=5) as response:
                  assert response.status == 200, f"{path} returned {response.status}"
                  return response.read()

          health = json.loads(get("/health"))
          assert health["status"] == "healthy", health
          print("health:", health["status"])

          animals = json.loads(get("/api/animals"))["animals"]
          assert len(animals) == 22, f"expected 22 animals, got {len(animals)}"
          print("animals:", len(animals))

          json.loads(get("/api/info"))
          json.loads(get("/api/audio"))
          assert b"animal-card" in get("/"), "home page did not render animal cards"
          print("smoke test passed")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs animal-sounds-ci || true

      - name: Stop test container
        if: always()
        run: docker rm -f animal-sounds-ci || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/animal-sounds
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
