<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Animal Soundboard</p>
      <h1>{{ app_name }}</h1>
      <p class="intro">A bright picture soundboard for curious listeners.</p>
      <div class="hero-actions">
        <button
          type="button"
          id="throw-mode-toggle"
          class="throw-toggle"
          aria-pressed="false"
        >
          <span class="mini-pokeball" aria-hidden="true"></span>
          <span>Throw Pokeball</span>
        </button>
      </div>
    </header>

    <section class="animal-grid" aria-label="Animals">
      {% for animal in animals %}
      <button
        type="button"
        class="animal-card"
        data-animal-id="{{ animal.id }}"
        data-animal-name="{{ animal.name }}"
        data-sound-label="{{ animal.sound_label }}"
        data-sound-pattern="{{ animal.sound_pattern }}"
        aria-label="{{ animal.name }} says {{ animal.sound_label }}"
      >
        <span class="animal-image-frame">
          <img
            src="{{ animal.image_url }}"
            alt="{{ animal.name }} illustration"
            width="240"
            height="180"
            draggable="false"
          />
        </span>
        <span class="animal-copy">
          <span class="animal-name">{{ animal.name }}</span>
          <span class="sound-chip">{{ animal.sound_label }}</span>
        </span>
      </button>
      {% endfor %}
    </section>

    <section class="system-panel" aria-label="Application status">
      <p><span class="status-dot"></span> Running on internal port <code>3000</code></p>
      <p>Config path: <code>{{ config_path }}</code></p>
      <p>API: <code>/health</code> <code>/api/info</code> <code>/api/animals</code></p>
    </section>

    <div id="sound-status" class="sr-only" aria-live="polite"></div>
    <div id="pokeball-layer" class="pokeball-layer" aria-hidden="true"></div>
  </main>
</body>
</html>
