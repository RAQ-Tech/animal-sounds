services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter-webui-app
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      APP_NAME: ${APP_NAME:-Starter WebUI App}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FEATURE_PLACEHOLDER: ${FEATURE_PLACEHOLDER:-true}
      CONFIG_PATH: /config
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
