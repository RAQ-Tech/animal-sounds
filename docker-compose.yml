services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animal-sounds
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      APP_NAME: ${APP_NAME:-Animal Sounds}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_PATH: /config
    volumes:
      - ./config:/config
    # No healthcheck here on purpose: the image defines one in the Dockerfile,
    # so it applies wherever the image runs, including Unraid. Two copies of the
    # same command only drift apart.
    restart: unless-stopped
